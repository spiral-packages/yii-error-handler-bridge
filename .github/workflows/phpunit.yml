on:
  pull_request:
  push:
    branches: [1.x]

name: phpunit

permissions:
  contents: read

jobs:
  phpunit:
    uses: spiral/gh-actions/.github/workflows/phpunit.yml@master
    with:
      os: >-
        ['ubuntu-latest']
      php: >-
        ['8.2', '8.3', '8.4', '8.5']
      stability: >-
        ['prefer-lowest', 'prefer-stable']
